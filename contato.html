<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina Senac - Contato</title>
    <meta name="description" content="Oficina de Desenvolvimento de sites para carros">
    <meta name="keywords" content="keyword1, keyword2">
    <meta property="og:title" content="Page Title">
    <meta property="og:description" content="Page description">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.example.com">
    <meta property="og:image" content="https://www.example.com/image.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:description" content="Page description">
    <meta name="twitter:image" content="https://www.example.com/image.jpg">
    <link rel="stylesheet" href="/assets/imagens/icones/favicon.ico">   

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="preload" href="assets/css/microframework.css" as="style"

    </noscript>
</head>
<body class="bem-cursor">
    <div id="navbar-principal-container"></div>
    <main>        
        <div id="navbar-secundaria-container"></div>
        <section class="bem-container revelar" id="contato-pagina">
            <h2 class="bem-titulo-h2">Entre em Contato</h2>
            <div class="bem-form-container">
                <form class="bem-form-modern" id="form-contato" novalidate>
                    <div class="bem-form__group">
                        <label class="bem-form__label">Nome Completo</label>
                        <input type="text" class="bem-form__input" placeholder="Seu nome..." id="nome" name="from_name" required>
                    </div>
                    <div class="bem-form__group">
                        <label class="bem-form__label">E-mail</label>
                        <input type="email" class="bem-form__input" placeholder="seu@email.com" id="email" name="reply_to" required>
                    </div>
                    <div class="bem-form__group">
                        <label class="bem-form__label">Assunto</label>
                        <select class="bem-form__input bem-form__select" id="assunto" name="subject" required>
                            <option value="" disabled selected>Selecione um assunto</option>
                            <option>Orçamento</option>
                            <option>Dúvida Técnica</option>
                            <option>Sugestão</option>
                            <option>Outros</option>
                        </select>
                    </div>
                    <div class="bem-form__group">
                        <label class="bem-form__label">Mensagem</label>
                        <textarea class="bem-form__textarea" placeholder="Como podemos ajudar?" id="mensagem" name="message" required></textarea>
                    </div>
                    <div style="display:none;">
                        <input type="text" id="campo-extra" name="campo-extra">
                    </div>
                    <button type="submit" class="bem-btn bem-btn--primary bem-btn--block" id="btn-enviar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                        <span>Enviar Mensagem</span>
                    </button>
                    <div id="contato-sucesso" class="bem-alert bem-alert--success contato-feedback" role="alert">
                            <span class="bem-alert__icon">✅</span>
                            <div class="bem-alert__content">
                                <p class="bem-alert__title">Mensagem enviada com sucesso!</p>
                                <p class="bem-alert__message">Recebemos seu contato e retornaremos em até 24 horas úteis.</p>
                            </div>
                        </div>
                        <div id="contato-erro" class="bem-alert bem-alert--danger contato-feedback" role="alert">
                            <span class="bem-alert__icon">❌</span>
                            <div class="bem-alert__content">
                                <p class="bem-alert__title">Preencha todos os campos obrigatórios.</p>
                                <p class="bem-alert__message">Verifique os campos destacados e tente novamente.</p>
                            </div>
                        </div>
                </form>
            </div>
        </section>
    </main>
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
    <script type="text/javascript">
    (function(){
        emailjs.init({
            publicKey: "VpfurKpWBffomAxL2",
        });
    })();
    </script>
    <footer id="footer-container"></footer>
    <script src="assets/js/footer.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
    // Validação e feedback do formulário de contato
    (function () {
        const form = document.getElementById('form-contato');
        const btnEnviar = document.getElementById('btn-enviar');
        const feedbackSucesso = document.getElementById('contato-sucesso');
        const feedbackErro = document.getElementById('contato-erro');
 
        function limparFeedback() {
            feedbackSucesso.classList.remove('visivel');
            feedbackErro.classList.remove('visivel');
        }
 
        function marcarCampo(campo, valido) {
            campo.classList.remove('bem-form__input--success', 'bem-form__input--error');
            campo.classList.add(valido ? 'bem-form__input--success' : 'bem-form__input--error');
        }
 
        // Validação em tempo real ao sair do campo
        form.querySelectorAll('.bem-form__input, .bem-form__textarea, .bem-form__select').forEach(function (campo) {
            campo.addEventListener('blur', function () {
                if (campo.value.trim() !== '') {
                    marcarCampo(campo, campo.checkValidity());
                }
            });
        });
 
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            limparFeedback();
 
            // Verificar honeypot
            const honeypot = form.querySelector('#campo-extra');
            if (honeypot && honeypot.value !== '') return;
 
            const camposObrigatorios = form.querySelectorAll('[required]');
            let formularioValido = true;
 
            camposObrigatorios.forEach(function (campo) {
                const valido = campo.checkValidity();
                marcarCampo(campo, valido);
                if (!valido) formularioValido = false;
            });
 
            if (!formularioValido) {
                feedbackErro.classList.add('visivel');
                feedbackErro.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                return;
            }

            // Estado de carregamento
            btnEnviar.disabled = true;
            const btnOriginalContent = btnEnviar.innerHTML;
            btnEnviar.innerHTML = 'Enviando...';

            emailjs.sendForm('service_vewnu6y', 'template_41n2dzy', this)
                .then(() => {
                    feedbackSucesso.classList.add('visivel');
                    feedbackSucesso.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    form.reset();
                    form.querySelectorAll('.bem-form__input, .bem-form__textarea, .bem-form__select').forEach(function (c) {
                        c.classList.remove('bem-form__input--success', 'bem-form__input--error');
                    });
                })
                .catch((error) => {
                    console.error('FAILED...', error);
                    feedbackErro.querySelector('.bem-alert__title').textContent = 'Erro ao enviar.';
                    feedbackErro.querySelector('.bem-alert__message').textContent = 'Ocorreu um erro técnico. Por favor, tente novamente mais tarde.';
                    feedbackErro.classList.add('visivel');
                })
                .finally(() => {
                    btnEnviar.disabled = false;
                    btnEnviar.innerHTML = btnOriginalContent;
                });
        });
    })();
    </script>
</body>
</html>
